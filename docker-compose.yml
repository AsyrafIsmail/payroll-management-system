services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - mysql
    env_file:
    - .env.docker

  mysql:
    image: mysql:8.0
    container_name: payroll_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: payroll_management
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
